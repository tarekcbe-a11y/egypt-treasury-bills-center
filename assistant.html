
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#ffd700">
<title>المساعد الذكي</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: calc(100% - 16px);
    max-width: 420px;
    height: calc(100% - 16px);
    margin: 8px auto;
    padding: 12px;
    background: #1e293b;
    border: 2px solid #ffd700;
    border-radius: 14px;

    display: grid;
    grid-template-rows:
        auto
        auto
        auto
        minmax(0, 1fr)
        auto
        auto;

    overflow: hidden;
}

/* الرأس الثابت */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    width: 48px;
    height: auto;
}

.lang {
    background: #ffd700;
    color: #111;
    border: 0;
    border-radius: 7px;
    padding: 9px 15px;
    font-weight: bold;
}

h1 {
    text-align: center;
    color: #ffd700;
    font-size: 23px;
    margin: 12px 0 6px;
}

.group {
    text-align: center;
    font-size: 15px;
    margin-bottom: 12px;
}

/* منطقة التمرير الوحيدة */
.content-scroll {
    min-height: 0;
    width: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    scrollbar-width: thin;
}

.intro {
    text-align: center;
    color: #cbd5e1;
    font-size: 13px;
    line-height: 1.9;
    margin-bottom: 16px;
    padding: 10px;
    background: #0f172a;
    border: 1px solid #64748b;
    border-radius: 9px;
}

.steps {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.step {
    background: linear-gradient(145deg, #172554, #0f1d43);
    border: 1px solid #b99b39;
    border-radius: 12px;
    padding: 15px 12px;
    min-height: 110px;
}

.step-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.number {
    width: 29px;
    height: 29px;
    flex: 0 0 29px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffd700;
    color: #172033;
    font-weight: bold;
    font-size: 14px;
}

.step-title {
    color: #f8d94c;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.5;
}

.step-value {
    color: white;
    font-size: 20px;
    font-weight: bold;
    margin: 8px 0 12px;
    direction: ltr;
    text-align: right;
    overflow-wrap: anywhere;
}

.step-description {
    color: #dbe4f0;
    font-size: 14px;
    line-height: 2;
    border-top: 1px solid #52617d;
    padding-top: 10px;
    overflow-wrap: anywhere;
}

.empty {
    text-align: center;
    color: #cbd5e1;
    padding: 30px 12px;
    line-height: 2;
    background: #0f172a;
    border: 1px solid #64748b;
    border-radius: 10px;
}

/* زر العودة ثابت */
.back {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #ffd700;
    color: #172033;
    font-size: 15px;
    font-weight: bold;
    text-decoration: none;
    text-align: center;
}

/* اسم المطور ثابت */
.footer {
    text-align: center;
    color: #ffd700;
    font-size: 11px;
    margin-top: 9px;
    padding-bottom: 2px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <img src="logo.png" class="logo" alt="شعار الجروب">
        <button class="lang" id="langBtn" onclick="toggleLanguage()">English</button>
    </div>

    <h1 id="pageTitle">المساعد الذكي</h1>

    <div class="group" id="groupName">
        جروب عملاء البنوك المصرية
    </div>

    <div class="content-scroll" id="contentScroll">

        <div class="intro" id="intro">
            شرح تفصيلي لنتائج عملية حساب أذون الخزانة،
            وفق البيانات المسجلة في الحاسبة الرئيسية.
        </div>

        <div class="steps" id="steps"></div>

    </div>

    <a href="index.html" class="back" id="backBtn">
        العودة إلى الحاسبة الرئيسية
    </a>

    <div class="footer">
        Developed by Tarek Metwally
    </div>

</div>

<script>
const STORAGE_KEY = 'treasuryLastAssistantCalculation';
const LANGUAGE_KEY = 'treasuryLanguage';

let isAr = true;

const stepInfo = [
    {
        key: 'nominal',
        title: ['القيمة الاسمية', 'Nominal Value'],
        description: [
            'هي القيمة الاسمية للأذون التي تم إدخالها في الحاسبة، والتي تُستخدم أساسًا لحساب قيمة الشراء والخصم والضريبة.',
            'The nominal face value entered into the calculator. It is the basis for calculating the purchase value, discount and tax.'
        ]
    },
    {
        key: 'marketDays',
        title: ['السوق والمدة', 'Market and Duration'],
        description: [
            'يوضح هذا الجزء السوق المختار، سواء السوق الأولي أو الثانوي، وعدد الأيام المحدد لاستحقاق الأذون.',
            'Shows the selected market, primary or secondary, and the selected number of days until maturity.'
        ]
    },
    {
        key: 'rate',
        title: ['سعر العائد', 'Yield Rate'],
        description: [
            'هو معدل العائد السنوي المدخل في الحاسبة، ويُستخدم في تحديد معامل القيمة الحالية وسعر الشراء.',
            'The annual yield rate entered in the calculator. It is used to determine the present-value factor and purchase price.'
        ]
    },
    {
        key: 'price',
        title: ['قيمة الشراء', 'Purchase Value'],
        description: [
            'تمثل المبلغ المدفوع لشراء الأذون بعد تطبيق معامل الخصم المرتبط بسعر العائد ومدة الأذون.',
            'The amount paid to purchase the bills after applying the discount factor based on the yield rate and duration.'
        ]
    },
    {
        key: 'discount',
        title: ['خصم الشراء المسترد', 'Purchase Discount Returned'],
        description: [
            'يمثل الفرق بين القيمة الاسمية وقيمة الشراء، وهو إجمالي الخصم الناتج عن شراء الأذون بأقل من قيمتها الاسمية.',
            'The difference between the nominal value and the purchase value. It represents the gross discount from purchasing below face value.'
        ]
    },
    {
        key: 'tax',
        title: ['الضريبة (20%)', 'Tax (20%)'],
        description: [
            'تمثل الضريبة المحسوبة بنسبة 20% من إجمالي خصم الشراء.',
            'The tax calculated at 20% of the gross purchase discount.'
        ]
    },
    {
        key: 'net',
        title: ['الربح الصافي', 'Net Profit'],
        description: [
            'هو إجمالي خصم الشراء بعد خصم الضريبة المحسوبة.',
            'The gross purchase discount after deducting the calculated tax.'
        ]
    },
    {
        key: 'maturity',
        title: ['المبلغ المسترد', 'Amount at Maturity'],
        description: [
            'هو إجمالي المبلغ الناتج عن قيمة الشراء مضافًا إليها الربح الصافي، وفق نتائج العملية المحسوبة.',
            'The total amount resulting from adding the net profit to the purchase value, according to the calculated operation.'
        ]
    },
    {
        key: 'annual',
        title: ['نسبة العائد السنوي', 'Annual Yield'],
        description: [
            'توضح نسبة العائد الصافي بعد الضريبة محسوبة على أساس سنوي وفق مدة الأذون.',
            'The net yield after tax, annualized according to the bill duration.'
        ]
    }
];

function readCalculation() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    } catch (e) {
        return null;
    }
}

function getValue(data, key) {
    const aliases = {
        nominal: ['nominal', 'P'],
        rate: ['rate', 'R'],
        days: ['days', 'duration', 'D'],
        market: ['market', 'marketName'],
        price: ['price', 'purchasePrice'],
        discount: ['discount', 'profit', 'grossProfit'],
        tax: ['tax'],
        net: ['netProfit', 'net'],
        maturity: ['finalAmount', 'maturity', 'total'],
        annual: ['annualYield', 'yield']
    };

    for (const name of aliases[key] || []) {
        if (data[name] !== undefined && data[name] !== null) {
            return data[name];
        }
    }

    return null;
}

function fmt(value) {
    if (value === null || value === undefined || value === '') {
        return '—';
    }

    if (typeof value === 'number') {
        return value.toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    return String(value);
}

function render() {
    const data = readCalculation();
    const steps = document.getElementById('steps');

    if (!data) {
        steps.innerHTML = `
            <div class="empty">
                ${isAr
                ? 'لا توجد عملية حساب مكتملة لشرحها حتى الآن. ارجع إلى الحاسبة واضغط على «احسب الآن».'
                : 'No completed calculation is available yet. Return to the calculator and press Calculate Now.'}
            </div>
        `;
        return;
    }

    steps.innerHTML = stepInfo.map((step, index) => {
        let value = '—';

        if (step.key === 'marketDays') {
            const market = getValue(data, 'market');
            const days = getValue(data, 'days');

            let marketText = market;

            if (market === 'primary') {
                marketText = isAr ? 'السوق الأولي' : 'Primary Market';
            }

            if (market === 'secondary') {
                marketText = isAr ? 'السوق الثانوي' : 'Secondary Market';
            }

            value = (marketText || '—') + ' • ' +
                    (days ?? '—') + (isAr ? ' يوم' : ' Days');

        } else {
            value = fmt(getValue(data, step.key));

            if (step.key === 'rate' || step.key === 'annual') {
                if (value !== '—') value += '%';
            }
        }

        return `
            <section class="step">
                <div class="step-head">
                    <span class="number">${index + 1}</span>
                    <span class="step-title">${step.title[isAr ? 0 : 1]}</span>
                </div>

                <div class="step-value">${value}</div>

                <div class="step-description">
                    ${step.description[isAr ? 0 : 1]}
                </div>
            </section>
        `;
    }).join('');
}

function toggleLanguage() {
    isAr = !isAr;

    localStorage.setItem(
        LANGUAGE_KEY,
        isAr ? 'ar' : 'en'
    );

    applyLanguage();
}

function applyLanguage() {
    document.documentElement.lang = isAr ? 'ar' : 'en';
    document.documentElement.dir = isAr ? 'rtl' : 'ltr';

    document.getElementById('langBtn').textContent =
        isAr ? 'English' : 'العربية';

    document.getElementById('pageTitle').textContent =
        isAr ? 'المساعد الذكي' : 'Smart Assistant';

    document.getElementById('groupName').textContent =
        isAr
        ? 'جروب عملاء البنوك المصرية'
        : 'Egyptian Bank Clients Group';

    document.getElementById('intro').textContent =
        isAr
        ? 'شرح تفصيلي لنتائج عملية حساب أذون الخزانة، وفق البيانات المسجلة في الحاسبة الرئيسية.'
        : 'A detailed explanation of the Treasury Bills calculation based on the data recorded in the main calculator.';

    document.getElementById('backBtn').textContent =
        isAr
        ? 'العودة إلى الحاسبة الرئيسية'
        : 'Back to Main Calculator';

    render();
}

function loadLanguage() {
    const saved = localStorage.getItem(LANGUAGE_KEY);
    isAr = saved !== 'en';
    applyLanguage();
}

loadLanguage();
</script>

</body>
</html>
