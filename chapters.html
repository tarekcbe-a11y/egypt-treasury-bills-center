        html+=`<div class="section"><h3>${heading}</h3>`;

        for(let i=1;i<=2;i++){
            const paragraph=section[isAr?i:i+3];
            if(paragraph) html+=`<p>${paragraph}</p>`;
        }

        html+="</div>";
    });

    $("content").innerHTML=html;

    $("subTitle").innerText=isAr
        ?"جروب عملاء البنوك المصرية"
        :"Egyptian Bank Clients Group";

    $("homeBtn").innerText=isAr
        ?"العودة للحاسبة":"Back to Calculator";

    $("indexBtn").innerText=isAr
        ?"العودة للفهرس":"Back to Index";
}

function toggleLang(){
    isAr=!isAr;
    document.documentElement.lang=isAr?"ar":"en";
    document.documentElement.dir=isAr?"rtl":"ltr";
    $("langBtn").innerText=isAr?"English":"العربية";
    renderChapter();
}

const params=new URLSearchParams(window.location.search);
const requested=parseInt(params.get("chapter"),10);

if(Number.isInteger(requested)&&requested>=1&&requested<=6){
    selectedChapter=requested;
}

function $(id){return document.getElementById(id);}

window.onload=renderChapter;
</script>
