/* =========================
   عرض الأبواب واللغة
========================= */

let selectedChapter=1;

function escapeHTML(value){
    return String(value).replace(/[&<>"']/g,function(char){
        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[char];
    });
}

function hasArabic(value){
    return /[\u0600-\u06FF]/.test(value);
}

function renderChapter(){

    const chapter=chapters[selectedChapter-1];

    document.title=chapter.title[isAr?0:1];

    $("pageTitle").innerText=chapter.title[isAr?0:1];

    let html="";

    chapter.sections.forEach(section=>{

        let englishHeadingIndex=-1;

        for(let i=1;i<section.length;i++){

            if(!hasArabic(section[i])){
                englishHeadingIndex=i;
                break;
            }

        }

        if(englishHeadingIndex<0){
            englishHeadingIndex=section.length;
        }

        const heading=section[isAr?0:englishHeadingIndex];

        const paragraphs=isAr
            ?section.slice(1,englishHeadingIndex)
            :section.slice(englishHeadingIndex+1);

        html+=`<div class="section"><h3>${escapeHTML(heading||"")}</h3>`;

        paragraphs.forEach(paragraph=>{

            if(paragraph){
                html+=`<p>${escapeHTML(paragraph)}</p>`;
            }

        });

        html+="</div>";

    });

    $("content").innerHTML=html;

    // يبدأ كل باب من أعلى المحتوى
    $("content").scrollTop=0;

    $("subTitle").innerText=isAr
        ?"جروب عملاء البنوك المصرية"
        :"Egyptian Bank Clients Group";

    $("homeBtn").innerText=isAr
        ?"العودة للحاسبة"
        :"Back to Calculator";

    $("indexBtn").innerText=isAr
        ?"العودة للفهرس"
        :"Back to Index";

    $("langBtn").innerText=isAr
        ?"English"
        :"العربية";
}

function toggleLang(){

    isAr=!isAr;

    document.documentElement.lang=isAr?"ar":"en";

    document.documentElement.dir=isAr?"rtl":"ltr";

    renderChapter();
}

========================= */

const params=new URLSearchParams(window.location.search);

const requested=parseInt(params.get("chapter"),10);

if(Number.isInteger(requested)&&requested>=1&&requested<=7){
    selectedChapter=requested;
}

function $(id){
    return document.getElementById(id);
}

window.onload=renderChapter;
